    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Noto Sans KR -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mg: {
                            blue: '#004B99',      // 새마을금고 시그니처 블루
                            darkblue: '#003066',  // 다크 블루
                            lightblue: '#0072CE', // 라이트 블루
                            sky: '#E8F2FA',       // 연한 배경 블루
                            gold: '#F59E0B'       // 골드 포인트
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            user-select: none;
        }
        canvas {
            touch-action: none;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .animate-pulse-ring {
            animation: pulse-ring 1.5s infinite ease-in-out;
        }
    </style>
</head>

    <script>
        // Game State Variables
        let canvas, ctx;
        let selectedTarget = 'MC'; // ML, MC, MR, TL, TC, TR, BL, BC, BR
        let powerGaugeValue = 50;
        let powerDirection = 2; // Direction of gauge oscillation
        let powerInterval = null;
        let isShooting = false;

        let totalKicks = 5;
        let currentKick = 0;
        let goalsCount = 0;
        let savesCount = 0;
        let discountRate = 0.0;

        let audioEnabled = true;
        let audioCtx = null;

        // Coordinates & Animation Entities
        let ball = { x: 0, y: 0, radius: 16, startX: 0, startY: 0, targetX: 0, targetY: 0, progress: 0 };
        let keeper = { x: 0, y: 0, width: 48, height: 70, targetX: 0, targetY: 0, animProgress: 0 };
        let targetCoords = {};

        window.onload = function() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            startPowerGauge();
            resetPositions();
            requestAnimationFrame(gameLoop);
        };

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

            updateTargetCoordinates();
            if (!isShooting) {
                resetPositions();
            }
        }

        function updateTargetCoordinates() {
            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;

            const goalLeft = w * 0.22;
            const goalRight = w * 0.78;
            const goalTop = h * 0.22;
            const goalBottom = h * 0.58;
            const goalCenterX = w * 0.5;
            const goalCenterY = (goalTop + goalBottom) / 2;

            targetCoords = {
                'TL': { x: goalLeft + 25, y: goalTop + 20 },
                'TC': { x: goalCenterX, y: goalTop + 20 },
                'TR': { x: goalRight - 25, y: goalTop + 20 },
                'ML': { x: goalLeft + 25, y: goalCenterY },
                'MC': { x: goalCenterX, y: goalCenterY },
                'MR': { x: goalRight - 25, y: goalCenterY },
                'BL': { x: goalLeft + 25, y: goalBottom - 20 },
                'BC': { x: goalCenterX, y: goalBottom - 20 },
                'BR': { x: goalRight - 25, y: goalBottom - 20 }
            };
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            const icon = document.getElementById('audioIcon');
            icon.className = audioEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark';
        }

        function playSound(type) {
            if (!audioEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            if (type === 'kick') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'goal') {
                // Cheering chord
                [261.63, 329.63, 392.00, 523.25].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.05);
                    gain.gain.setValueAtTime(0.2, now + idx * 0.05);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.05);
                    osc.stop(now + 0.6);
                });
            } else if (type === 'save') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.25);
                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        function setTarget(pos) {
            if (isShooting) return;
            selectedTarget = pos;
            document.querySelectorAll('.target-btn').forEach(btn => {
                btn.className = "target-btn py-2 text-xs font-bold rounded-lg border border-slate-600 bg-slate-700 hover:bg-mg-blue transition";
            });
            const activeBtn = document.getElementById(`target-${pos}`);
            if (activeBtn) {
                activeBtn.className = "target-btn py-2 text-xs font-bold rounded-lg border border-mg-blue bg-mg-blue text-white shadow transition";
            }
        }

        function startPowerGauge() {
            if (powerInterval) clearInterval(powerInterval);
            powerInterval = setInterval(() => {
                if (isShooting) return;
                powerGaugeValue += powerDirection;
                if (powerGaugeValue >= 100) {
                    powerGaugeValue = 100;
                    powerDirection = -3;
                } else if (powerGaugeValue <= 0) {
                    powerGaugeValue = 0;
                    powerDirection = 3;
                }
                document.getElementById('powerGauge').style.width = `${powerGaugeValue}%`;
                document.getElementById('powerValueText').innerText = `${powerGaugeValue}%`;
            }, 25);
        }

        function resetPositions() {
            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;

            ball.x = w * 0.5;
            ball.y = h * 0.82;
            ball.radius = 16;
            ball.progress = 0;

            keeper.x = w * 0.5;
            keeper.y = h * 0.48;
            keeper.targetX = w * 0.5;
            keeper.targetY = h * 0.48;
            keeper.animProgress = 0;
        }

        function shootBall() {
            if (isShooting || currentKick >= totalKicks) return;

            isShooting = true;
            currentKick++;
            document.getElementById('kickBtn').disabled = true;
            document.getElementById('kickBtn').classList.add('opacity-50');

            playSound('kick');

            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;

            const t = targetCoords[selectedTarget];
            
            // Add power deviation factor
            let deviation = (Math.abs(powerGaugeValue - 70) / 100) * 40;
            ball.startX = ball.x;
            ball.startY = ball.y;
            ball.targetX = t.x + (Math.random() - 0.5) * deviation;
            ball.targetY = t.y + (Math.random() - 0.5) * deviation;

            // AI Goalkeeper dive decision
            const posKeys = Object.keys(targetCoords);
            // 45% chance keeper guesses correctly, 55% random/wrong
            let keeperTargetKey = posKeys[Math.floor(Math.random() * posKeys.length)];
            if (Math.random() < 0.45) {
                keeperTargetKey = selectedTarget;
            }

            const kt = targetCoords[keeperTargetKey];
            keeper.targetX = kt.x;
            keeper.targetY = kt.y;
        }

        function gameLoop() {
            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;

            ctx.clearRect(0, 0, w, h);

            // 1. Draw Field & Stadium Background
            const bgGradient = ctx.createLinearGradient(0, 0, 0, h);
            bgGradient.addColorStop(0, '#0f172a');
            bgGradient.addColorStop(0.3, '#1e293b');
            bgGradient.addColorStop(0.35, '#15803d');
            bgGradient.addColorStop(1, '#166534');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, w, h);

            // Grass stripes
            for (let i = 0; i < 6; i++) {
                ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.03)';
                ctx.fillRect(0, h * 0.35 + (i * h * 0.11), w, h * 0.11);
            }

            // 2. Draw Goal Post & Net
            const gL = w * 0.22;
            const gR = w * 0.78;
            const gT = h * 0.22;
            const gB = h * 0.58;

            // Net Grid Lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 1;
            for (let x = gL; x <= gR; x += 14) {
                ctx.beginPath();
                ctx.moveTo(x, gT);
                ctx.lineTo(x, gB);
                ctx.stroke();
            }
            for (let y = gT; y <= gB; y += 12) {
                ctx.beginPath();
                ctx.moveTo(gL, y);
                ctx.lineTo(gR, y);
                ctx.stroke();
            }

            // Goal Posts (White frame)
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 6;
            ctx.strokeRect(gL, gT, gR - gL, gB - gT);

            // Penalty Spot
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(w * 0.5, h * 0.82, 4, 0, Math.PI * 2);
            ctx.fill();

            // 3. Target Reticle Indicator
            if (targetCoords[selectedTarget] && !isShooting) {
                const target = targetCoords[selectedTarget];
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 2;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.arc(target.x, target.y, 16, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 4. Update and Draw Goalkeeper
            if (isShooting && keeper.animProgress < 1) {
                keeper.animProgress += 0.05;
                keeper.x += (keeper.targetX - keeper.x) * 0.12;
                keeper.y += (keeper.targetY - keeper.y) * 0.12;
            }

            // Goalkeeper Body Drawing
            ctx.save();
            ctx.translate(keeper.x, keeper.y);
            
            // Keeper Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.ellipse(0, 30, 24, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Jersey Body (Gold / Yellow MG Jersey)
            ctx.fillStyle = '#f59e0b';
            ctx.beginPath();
            ctx.roundRect(-18, -25, 36, 38, 8);
            ctx.fill();

            // Head
            ctx.fillStyle = '#fbcfe8';
            ctx.beginPath();
            ctx.arc(0, -34, 12, 0, Math.PI * 2);
            ctx.fill();

            // Gloves / Arms
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-22, -10, 7, 0, Math.PI * 2);
            ctx.arc(22, -10, 7, 0, Math.PI * 2);
            ctx.fill();

            // MG Chest Logo
            ctx.fillStyle = '#004B99';
            ctx.font = 'bold 10px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('MG', 0, -5);

            ctx.restore();

            // 5. Update & Draw Ball Trajectory
            if (isShooting) {
                ball.progress += 0.04;
                if (ball.progress > 1) ball.progress = 1;

                ball.x = ball.startX + (ball.targetX - ball.startX) * ball.progress;
                ball.y = ball.startY + (ball.targetY - ball.startY) * ball.progress;
                ball.radius = 16 - (ball.progress * 7); // Ball shrinks as it moves away

                if (ball.progress === 1) {
                    evaluateShot();
                }
            }

            // Ball Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.beginPath();
            ctx.ellipse(ball.x, ball.y + ball.radius * 0.8, ball.radius, ball.radius * 0.4, 0, 0, Math.PI * 2);
            ctx.fill();

            // Soccer Ball
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, Math.max(4, ball.radius), 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Ball Pattern Details
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, Math.max(2, ball.radius * 0.35), 0, Math.PI * 2);
            ctx.fill();

            requestAnimationFrame(gameLoop);
        }

        function evaluateShot() {
            const distToKeeper = Math.hypot(ball.x - keeper.x, ball.y - keeper.y);
            const isSave = distToKeeper < 35;

            if (isSave) {
                savesCount++;
                playSound('save');
                showOverlay('missOverlay');
            } else {
                goalsCount++;
                discountRate = Math.min(0.5, goalsCount * 0.1);
                playSound('goal');
                showOverlay('goalOverlay');
            }

            updateScoreboard();

            setTimeout(() => {
                hideOverlays();
                if (currentKick >= totalKicks) {
                    showFinalModal();
                } else {
                    isShooting = false;
                    resetPositions();
                    document.getElementById('kickBtn').disabled = false;
                    document.getElementById('kickBtn').classList.remove('opacity-50');
                }
            }, 1600);
        }

        function showOverlay(overlayId) {
            const el = document.getElementById(overlayId);
            el.classList.remove('opacity-0', 'pointer-events-none', 'scale-75');
            el.classList.add('opacity-100', 'scale-100');
        }

        function hideOverlays() {
            ['goalOverlay', 'missOverlay'].forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('opacity-100', 'scale-100');
                el.classList.add('opacity-0', 'pointer-events-none', 'scale-75');
            });
        }

        function updateScoreboard() {
            document.getElementById('kicksLeftDisplay').innerText = `${totalKicks - currentKick} / ${totalKicks}`;
            document.getElementById('goalsDisplay').innerText = goalsCount;
            document.getElementById('savesDisplay').innerText = savesCount;
            document.getElementById('discountDisplay').innerText = `-${discountRate.toFixed(2)}%p`;
        }

        function showFinalModal() {
            document.getElementById('finalGoalsText').innerText = `${goalsCount} / ${totalKicks} 골`;
            document.getElementById('finalDiscountText').innerText = `-${discountRate.toFixed(2)}%p`;

            const modal = document.getElementById('resultModal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function resetMatch() {
            currentKick = 0;
            goalsCount = 0;
            savesCount = 0;
            discountRate = 0.0;
            isShooting = false;

            updateScoreboard();
            resetPositions();

            document.getElementById('kickBtn').disabled = false;
            document.getElementById('kickBtn').classList.remove('opacity-50');

            const modal = document.getElementById('resultModal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function goToCalculatorWithDiscount() {
            // Navigate to loan calculator page passing discount rate
            window.location.href = `./cal.html?discount=${discountRate.toFixed(2)}`;
        }
    </script>
</body>
</html>
